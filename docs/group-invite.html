<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1230">
  <title>Join group • Peerloom</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root { --bg:#120d22; --panel:#1b1431; --panel2:#251b43; --ink:#f4f1ff; --mute:#a79fc4; --brand:#7c3aed; --brand2:#9f67ff; --line:rgba(255,255,255,.08); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; display:flex; flex-direction:column; height:100dvh; }
    header { display:flex; align-items:center; gap:12px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
    .avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; overflow:hidden; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .title { flex:1; min-width:0; }
    .title h1 { font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .title p { font-size:.78rem; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn { border:0; border-radius:10px; padding:10px 16px; font-weight:700; font-size:.9rem; cursor:pointer; font-family:inherit; }
    .btn-primary { background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; }
    .btn-ghost { background:transparent; color:var(--brand2); border:2px solid var(--brand); }
    .banner { background:var(--panel2); color:var(--mute); font-size:.78rem; text-align:center; padding:8px 12px; border-bottom:1px solid var(--line); }
    main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
    .msg { max-width:82%; background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px; cursor:pointer; align-self:flex-start; }
    .msg .who { font-size:.72rem; font-weight:700; color:var(--brand2); margin-bottom:2px; }
    .msg .txt { font-size:.92rem; line-height:1.4; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg .at { font-size:.65rem; color:var(--mute); margin-top:3px; text-align:right; }
    .center { margin:auto; text-align:center; max-width:340px; padding:24px 8px; }
    .center h2 { font-size:1.15rem; margin-bottom:8px; }
    .center p { color:var(--mute); font-size:.9rem; line-height:1.5; margin-bottom:16px; }
    .composer { display:flex; gap:10px; align-items:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
    .fake-input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:22px; padding:12px 16px; color:var(--mute); font-size:.92rem; cursor:pointer; text-align:left; font-family:inherit; }
    .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
    .sheet-back.open { display:flex; }
    .sheet { width:100%; max-width:480px; background:var(--panel); border-radius:20px 20px 0 0; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
    .sheet h3 { font-size:1.15rem; margin-bottom:6px; }
    .sheet p { color:var(--mute); font-size:.9rem; margin-bottom:18px; line-height:1.5; }
    .sheet .btn { width:100%; margin-bottom:10px; padding:14px; }
    .sheet .close { background:none; border:0; color:var(--mute); font-size:.85rem; cursor:pointer; margin-top:4px; }
    .hidden { display:none !important; }
    @media (min-width:700px){ body{align-items:center;} body > * { width:100%; max-width:560px; } .sheet-back{align-items:center;} .sheet{border-radius:20px;} }
  </style>
</head>
<body>
  <header>
    <div class="avatar" id="avatar">P</div>
    <div class="title"><h1 id="gName">Loading…</h1><p id="gMeta">&nbsp;</p></div>
    <button class="btn btn-primary" id="topJoin">Join</button>
  </header>
  <div class="banner" id="banner">You're viewing this group in read-only mode.</div>
  <main id="list"></main>
  <div class="composer" id="composer">
    <button class="fake-input" id="fakeInput" type="button">Sign up to join the conversation…</button>
  </div>

  <div class="sheet-back" id="sheetBack" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet">
      <h3 id="sheetTitle">Join this group</h3>
      <p id="sheetText">Create a free Peerloom account to read and chat with the group.</p>
      <button class="btn btn-primary" id="goSignup">Create account</button>
      <button class="btn btn-ghost" id="goLogin">I already have an account — Log in</button>
      <button class="close" id="sheetClose" type="button">Not now</button>
    </div>
  </div>

<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const params = new URLSearchParams(location.search);
  const gid = params.get('groupId') || '';
  const code = params.get('code') || '';
  const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(gid);

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Where the person lands after signing up (and verifying email) or logging in.
  const target = `chatroom.html?groupId=${encodeURIComponent(gid)}` + (code ? `&code=${encodeURIComponent(code)}` : '');
  const signupUrl = `signup.html?redirect=${encodeURIComponent(target)}`;
  const loginUrl  = `login.html?redirect=${encodeURIComponent(target)}`;

  function openSheet() { $('sheetBack').classList.add('open'); }
  function closeSheet() { $('sheetBack').classList.remove('open'); }
  ['topJoin', 'fakeInput'].forEach(id => $(id).addEventListener('click', openSheet));
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', e => { if (e.target === $('sheetBack')) closeSheet(); });
  $('goSignup').addEventListener('click', () => { location.href = signupUrl; });
  $('goLogin').addEventListener('click', () => { location.href = loginUrl; });

  function unavailable(msg) {
    $('gName').textContent = 'Peerloom';
    $('banner').classList.add('hidden'); $('composer').classList.add('hidden'); $('topJoin').classList.add('hidden');
    const c = el('div', 'center');
    c.append(el('h2', null, 'This group link isn’t available'), el('p', null, msg));
    const b = el('button', 'btn btn-primary', 'Go to Peerloom'); b.onclick = () => { location.href = 'index.html'; };
    c.append(b); $('list').replaceChildren(c);
  }

  async function main() {
    if (!isUuid) return unavailable('The link looks incomplete. Ask whoever sent it to share it again.');

    // Already logged in? Skip the preview and go straight into the group.
    try {
      const { data } = await supabase.auth.getSession();
      if (data && data.session) { location.replace(target); return; }
    } catch (e) { /* treat as logged out */ }

    const { data: g, error } = await supabase.rpc('group_invite_preview', { p_group_id: gid });
    if (error || !g) return unavailable('This group may have been removed or is currently unavailable.');

    document.title = `${g.name} • Peerloom`;
    $('gName').textContent = g.name;
    const meta = [`${g.member_count} member${g.member_count === 1 ? '' : 's'}`, g.course_code, g.institution].filter(Boolean).join(' · ');
    $('gMeta').textContent = meta;
    const av = $('avatar');
    if (g.cover_photo && /^https:\/\//i.test(g.cover_photo)) {
      const img = new Image(); img.alt = ''; img.referrerPolicy = 'no-referrer'; img.src = g.cover_photo;
      img.onerror = () => { av.textContent = (g.name || 'P').trim().charAt(0).toUpperCase(); };
      av.textContent = ''; av.append(img);
    } else av.textContent = (g.name || 'P').trim().charAt(0).toUpperCase();

    $('sheetTitle').textContent = `Join “${g.name}”`;
    const list = $('list');

    if (!g.is_public) {
      // Private group: no messages are shown to outsiders.
      $('banner').textContent = 'Private group';
      const c = el('div', 'center');
      c.append(el('h2', null, '🔒 This is a private group'));
      if (g.description) c.append(el('p', null, g.description));
      if (code) {
        c.append(el('p', null, 'You’ve been invited. Create an account or log in to join and see the conversation.'));
        const b = el('button', 'btn btn-primary', 'Join this group'); b.onclick = openSheet; c.append(b);
      } else {
        c.append(el('p', null, 'You need an invite link from a group admin to join. If you already have an account, log in first.'));
        const b = el('button', 'btn btn-primary', 'Log in'); b.onclick = () => { location.href = 'login.html'; }; c.append(b);
        $('topJoin').classList.add('hidden'); $('composer').classList.add('hidden');
      }
      list.replaceChildren(c);
      return;
    }

    // Public group: read-only preview of the latest text messages.
    const msgs = Array.isArray(g.messages) ? g.messages : [];
    if (!msgs.length) {
      const c = el('div', 'center');
      c.append(el('h2', null, 'Be the first to say hello'), el('p', null, g.description || 'Join this group to start the conversation.'));
      list.replaceChildren(c);
    } else {
      if (g.description) { const d = el('div', 'banner', g.description); d.style.borderRadius = '10px'; d.style.border = '1px solid var(--line)'; list.append(d); }
      msgs.forEach(m => {
        const b = el('div', 'msg');
        b.append(el('div', 'who', m.sender_name || 'Member'), el('div', 'txt', m.content || ''));
        try { b.append(el('div', 'at', new Date(m.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))); } catch (e) { /* ignore */ }
        b.addEventListener('click', openSheet);       // interacting with anything asks them to join
        list.append(b);
      });
      list.scrollTop = list.scrollHeight;
    }
  }
  main().catch(() => unavailable('Something went wrong loading this group. Please try again.'));
</script>
</body>
</html>
