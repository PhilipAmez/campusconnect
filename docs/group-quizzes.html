<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Quizzes - PeerLoom</title>
<link rel="stylesheet" href="group-quizzes.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="light">

    <nav class="ios-nav" id="navBar">
        <button class="back-button" id="backButton" aria-label="Back to Active Groups">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="nav-title" id="navTitle">Quizzes</div>
        <button class="back-button" id="homeButton" aria-label="Go to Dashboard" style="margin-left:auto;">
            <i class="fas fa-house"></i>
        </button>
    </nav>

    <main class="quiz-hub-container">

        <!-- Hero -->
        <section class="hero-card animate-fade-in">
            <div class="hero-heading">📚 <span id="heroTitle">Group Quizzes</span></div>
            <div class="hero-meta" id="heroMeta">
                <!-- populated by JS -->
            </div>
        </section>

        <!-- Stats -->
        <section class="stats-grid animate-fade-in" id="statsGrid">
            <div class="stat-card available">
                <div class="stat-value" id="statAvailable">0</div>
                <div class="stat-label">Available</div>
            </div>
            <div class="stat-card upcoming">
                <div class="stat-value" id="statUpcoming">0</div>
                <div class="stat-label">Upcoming</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-value" id="statCompleted">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card average">
                <div class="stat-value" id="statAverage">—</div>
                <div class="stat-label">Average Score</div>
            </div>
        </section>

        <!-- Search + Filters + Sort -->
        <section class="search-filters-container animate-fade-in">
            <div class="ios-search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search quizzes...">
            </div>

            <div class="segmented-control" id="filterControl">
                <button class="segment-btn active" data-filter="all">All</button>
                <button class="segment-btn" data-filter="available">Available</button>
                <button class="segment-btn" data-filter="upcoming">Upcoming</button>
                <button class="segment-btn" data-filter="completed">Completed</button>
                <button class="segment-btn" data-filter="closed">Closed</button>
            </div>

            <div class="sort-row">
                <label for="sortSelect">Sort by</label>
                <select class="ios-select" id="sortSelect">
                    <option value="newest">Newest</option>
                    <option value="closing_soon">Closing Soon</option>
                    <option value="highest_marks">Highest Marks</option>
                    <option value="alphabetical">Alphabetical</option>
                </select>
            </div>
        </section>

        <!-- Quiz list -->
        <section id="quizListSection">
            <div class="quiz-list" id="quizList">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>

    </main>

    <div class="toast" id="toast"></div>

    <script type="module" src="group-quizzes.js"></script></body>
</html>
