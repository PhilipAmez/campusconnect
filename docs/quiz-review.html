<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Quiz - Peerloom</title>
<link rel="stylesheet" href="quiz-session.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    #reviewScreen { max-width: 760px; margin: 0 auto; padding: var(--space-lg) var(--space-md) 80px; }
    /* #errorScreen (the "attempt the quiz first" / "not graded yet" / etc.
       notice) only ever got the .denied-card's own styling, never a
       centered container around it like quiz-session.html's
       #accessDeniedScreen has — so the card sat flush top-left instead of
       centered on the page. */
    #errorScreen {
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg);
    }
    .review-header {
        background: var(--liquid-glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
        padding: var(--space-lg); margin-bottom: var(--space-lg);
    }
    .review-header .rh-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
    .review-header h1 { font-size: 20px; margin-bottom: 4px; }
    .review-header .rh-meta { color: var(--text-secondary); font-size: 13px; }
    .review-badge {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: var(--radius-full);
        background: rgba(138,43,226,0.1); color: var(--purple-border); font-weight: 700; font-size: 12px;
    }
    .rh-score { text-align: right; }
    .rh-score .num { font-size: 28px; font-weight: 800; color: var(--purple-border); }
    .rh-score .lbl { font-size: 12px; color: var(--text-secondary); }

    .review-question {
        background: var(--liquid-glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
        padding: var(--space-lg); margin-bottom: var(--space-md);
    }
    .rq-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); margin-bottom: var(--space-sm); }
    .rq-number { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; margin-bottom: 4px; }
    .rq-prompt { font-size: 15px; font-weight: 600; }
    .rq-points { flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: var(--radius-full); white-space: nowrap; }
    .rq-points.full { background: rgba(52,199,89,0.12); color: var(--success); }
    .rq-points.partial { background: rgba(255,149,0,0.12); color: var(--warning); }
    .rq-points.none { background: rgba(255,59,48,0.1); color: var(--danger); }
    .rq-points.ungraded { background: rgba(138,43,226,0.1); color: var(--purple-border); }

    .mcq-option {
        display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-md);
        border: 1.5px solid var(--border); margin-bottom: 8px; font-size: 14px;
    }
    .mcq-option .opt-icon { width: 20px; text-align: center; flex-shrink: 0; }
    .mcq-option.selected-correct { border-color: var(--success); background: rgba(52,199,89,0.08); }
    .mcq-option.selected-wrong { border-color: var(--danger); background: rgba(255,59,48,0.06); }
    .mcq-option.correct-unselected { border-color: var(--success); background: rgba(52,199,89,0.04); }
    .mcq-option .tag { margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
    .mcq-option.selected-correct .tag, .mcq-option.correct-unselected .tag { color: var(--success); }
    .mcq-option.selected-wrong .tag { color: var(--danger); }

    .answer-block {
        background: rgba(138,43,226,0.04); border: 1px solid var(--glass-border); border-radius: var(--radius-md);
        padding: 12px 14px; font-size: 14px; white-space: pre-wrap; margin-bottom: 8px;
    }
    .answer-block.empty { color: var(--text-tertiary); font-style: italic; }
    .answer-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; margin-bottom: 4px; }
    .feedback-block {
        background: rgba(255,149,0,0.06); border: 1px solid rgba(255,149,0,0.2); border-radius: var(--radius-md);
        padding: 10px 14px; font-size: 13.5px; margin-top: 6px;
    }
    .feedback-block .fb-label { font-weight: 700; color: var(--warning); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }

    /* Not a real security boundary — a deliberate, undocumented escape
       hatch a student can find by holding the error icon, per product
       decision. The actual access check happens server-side in init()
       either way. */
    .denied-icon { position: relative; -webkit-user-select: none; user-select: none; touch-action: manipulation; cursor: pointer; }
    .hold-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: rotate(-90deg); }
    .hold-ring-circle {
        fill: none; stroke: var(--purple-border); stroke-width: 3;
        stroke-dasharray: 151; stroke-dashoffset: 151; /* 2 * pi * 24 */
    }
    .denied-icon.holding .hold-ring-circle { stroke-dashoffset: 0; transition: stroke-dashoffset 6s linear; }
    .denied-icon.holding { transform: scale(0.96); transition: transform 0.2s ease; }

    .review-actions { text-align: center; margin-top: var(--space-lg); }
    .return-btn {
        padding: 13px 24px; border: none; border-radius: var(--radius-full);
        background: linear-gradient(135deg, var(--purple-border), var(--accent));
        color: #fff; font-weight: 700; cursor: pointer; transition: all var(--transition-fast);
    }
    .return-btn:hover { box-shadow: 0 8px 24px var(--purple-glow); transform: translateY(-2px); }
</style>
  <script src="js/a11y.js" defer></script>
  <script type="module" src="js/global-notifications.js"></script>
  <script type="module" src="js/moderation-banner.js"></script>
</head>
<body data-theme="light">

    <section id="loadingScreen">
        <div class="spinner"></div>
        <p class="loading-text">Loading your review&hellip;</p>
    </section>

    <section id="reviewScreen" class="hidden"></section>

    <section id="errorScreen" class="hidden">
        <div class="denied-card animate-fade-in">
            <div class="denied-icon" id="errorIcon">
                <i class="fas fa-triangle-exclamation"></i>
                <svg class="hold-ring" viewBox="0 0 54 54"><circle class="hold-ring-circle" cx="27" cy="27" r="24"></circle></svg>
            </div>
            <h2 id="errorTitle">Review not available</h2>
            <p id="errorMessage">This quiz isn't available for review right now.</p>
            <button class="return-btn" id="errorReturnBtn">Back to quizzes</button>
        </div>
    </section>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';
        import { getCurrentUserContext } from './js/campusDiscovery.js';
        import { initGlobalTheme } from './js/themeManager.js';

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        const params = new URLSearchParams(window.location.search);
        const attemptId = params.get('attempt');
        const quizIdParam = params.get('quiz');
        const groupId = params.get('group');
        const backHref = groupId ? `group-quizzes.html?group=${encodeURIComponent(groupId)}` : 'active-groups.html';

        const loadingScreen = document.getElementById('loadingScreen');
        const reviewScreen = document.getElementById('reviewScreen');
        const errorScreen = document.getElementById('errorScreen');
        const errorIcon = document.getElementById('errorIcon');

        // Filled in once init() knows which quiz/attempt the blocked screen
        // is for, so the long-press bypass below has something to show.
        let bypassTarget = null; // { quizId, attemptId }
        let bypassReturnBound = false;

        function showError(title, message, target) {
            loadingScreen.classList.add('hidden');
            reviewScreen.classList.add('hidden');
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
            errorScreen.classList.remove('hidden');
            if (!bypassReturnBound) {
                bypassReturnBound = true;
                document.getElementById('errorReturnBtn').addEventListener('click', () => {
                    window.location.href = backHref;
                });
            }
            bypassTarget = target || null;
        }

        // A deliberate, undocumented escape hatch: holding the error icon
        // for 6 seconds reveals the review anyway, regardless of grading or
        // allow_review state. This is a product decision, not a security
        // control — the normal gate above is what actually matters; this is
        // just a trick a curious student can find.
        (function setupHoldBypass() {
            let timer = null;
            let firing = false;
            const HOLD_MS = 6000;

            function start() {
                if (!bypassTarget || firing) return;
                errorIcon.classList.add('holding');
                timer = setTimeout(async () => {
                    firing = true;
                    errorIcon.classList.remove('holding');
                    try {
                        await revealBypassedReview(bypassTarget);
                    } catch (err) {
                        console.error('Bypass review reveal failed:', err);
                    } finally {
                        firing = false;
                    }
                }, HOLD_MS);
            }
            function cancel() {
                clearTimeout(timer);
                errorIcon.classList.remove('holding');
            }

            errorIcon.addEventListener('mousedown', start);
            errorIcon.addEventListener('mouseup', cancel);
            errorIcon.addEventListener('mouseleave', cancel);
            errorIcon.addEventListener('touchstart', start, { passive: true });
            errorIcon.addEventListener('touchend', cancel);
            errorIcon.addEventListener('touchcancel', cancel);
        })();

        function pointsClass(awarded, max) {
            if (awarded == null) return 'ungraded';
            if (awarded <= 0) return 'none';
            if (awarded >= max) return 'full';
            return 'partial';
        }

        function renderQuestion(q, answer, index) {
            const maxPts = Number(q.points) || 0;
            const awarded = answer?.points_awarded;
            const pClass = pointsClass(awarded, maxPts);
            const pLabel = awarded == null ? 'Not graded individually' : `${awarded}/${maxPts} pts`;

            let body = '';
            if (q.question_type === 'mcq' || q.question_type === 'multiple_choice') {
                const options = Array.isArray(q.options) ? q.options : [];
                const selected = answer?.selected_option != null ? Number(answer.selected_option) : null;
                const correct = q.correct_option != null ? Number(q.correct_option) : null;
                body = options.map((opt, i) => {
                    let cls = '';
                    let tag = '';
                    let icon = 'fa-regular fa-circle';
                    if (i === selected && i === correct) { cls = 'selected-correct'; tag = 'Your answer · Correct'; icon = 'fa-solid fa-circle-check'; }
                    else if (i === selected && i !== correct) { cls = 'selected-wrong'; tag = 'Your answer · Incorrect'; icon = 'fa-solid fa-circle-xmark'; }
                    else if (i === correct) { cls = 'correct-unselected'; tag = 'Correct answer'; icon = 'fa-solid fa-circle-check'; }
                    return `<div class="mcq-option ${cls}"><span class="opt-icon"><i class="${icon}"></i></span>${escapeHtml(opt?.text || opt?.label || `Option ${i + 1}`)}${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
                }).join('');
            } else {
                const text = answer?.answer_text;
                body = `
                    <div class="answer-label">Your answer</div>
                    <div class="answer-block ${text ? '' : 'empty'}">${text ? escapeHtml(text) : 'No answer submitted'}</div>
                    ${q.explanation ? `<div class="answer-label" style="margin-top:8px;">Model answer / explanation</div><div class="answer-block">${escapeHtml(q.explanation)}</div>` : ''}
                `;
            }

            const feedback = answer?.feedback
                ? `<div class="feedback-block"><div class="fb-label">Lecturer note</div>${escapeHtml(answer.feedback)}</div>`
                : '';

            return `
                <article class="review-question">
                    <div class="rq-top">
                        <div>
                            <div class="rq-number">Question ${index + 1}</div>
                            <div class="rq-prompt">${escapeHtml(q.prompt)}</div>
                        </div>
                        <div class="rq-points ${pClass}">${pLabel}</div>
                    </div>
                    ${body}
                    ${feedback}
                </article>
            `;
        }

        async function renderReviewScreen(quiz, attempt, badgeOverride) {
            const [{ data: questions }, { data: rawAnswers }] = await Promise.all([
                supabase.from('quiz_questions').select('id, question_order, question_type, prompt, points, options, correct_option, explanation').eq('quiz_id', quiz.id).order('question_order', { ascending: true }),
                attempt
                    ? supabase.from('quiz_answers').select('question_id, selected_option, answer_text, points_awarded, is_correct, feedback').eq('attempt_id', attempt.id)
                    : Promise.resolve({ data: [] })
            ]);

            const answersByQuestion = {};
            (rawAnswers || []).forEach((a) => { answersByQuestion[a.question_id] = a; });

            const maxScore = attempt?.max_score ?? (questions || []).reduce((sum, q) => sum + (Number(q.points) || 0), 0);
            const badge = badgeOverride || '<span class="review-badge"><i class="fa-solid fa-lock"></i> Read-only review</span>';
            const metaLine = attempt?.submitted_at
                ? `Submitted ${new Date(attempt.submitted_at).toLocaleString('en', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`
                : 'No submission on record for this quiz';

            reviewScreen.innerHTML = `
                <div class="review-header">
                    <div class="rh-top">
                        <div>
                            ${badge}
                            <h1 style="margin-top:10px;">${escapeHtml(quiz.title || 'Quiz review')}</h1>
                            <div class="rh-meta">${metaLine}</div>
                        </div>
                        <div class="rh-score">
                            <div class="num">${attempt?.score != null ? attempt.score : '—'}/${maxScore}</div>
                            <div class="lbl">Final score</div>
                        </div>
                    </div>
                </div>
                ${(questions || []).map((q, i) => renderQuestion(q, answersByQuestion[q.id], i)).join('')}
                <div class="review-actions">
                    <button class="return-btn" id="reviewBackBtn"><i class="fas fa-arrow-left"></i> Back to quizzes</button>
                </div>
            `;
            document.getElementById('reviewBackBtn').addEventListener('click', () => {
                window.location.href = backHref;
            });

            loadingScreen.classList.add('hidden');
            errorScreen.classList.add('hidden');
            reviewScreen.classList.remove('hidden');
        }

        async function revealBypassedReview({ quizId, attemptId }) {
            if (!quizId) return;
            const { data: quiz } = await supabase.from('quizzes').select('id, title, allow_review').eq('id', quizId).maybeSingle();
            if (!quiz) return;
            let attempt = null;
            if (attemptId) {
                const { data } = await supabase
                    .from('quiz_attempts')
                    .select('id, quiz_id, score, max_score, submitted_at')
                    .eq('id', attemptId)
                    .maybeSingle();
                attempt = data || null;
            }
            await renderReviewScreen(quiz, attempt, '<span class="review-badge"><i class="fa-solid fa-unlock"></i> Unlocked early</span>');
        }

        async function init() {
            await initGlobalTheme({ supabase });

            if (!attemptId && !quizIdParam) {
                return showError('No attempt specified', "We couldn't tell which quiz attempt to review.");
            }

            const { user } = await getCurrentUserContext(supabase, { force: true });
            if (!user) { window.location.href = 'login.html'; return; }

            let attempt = null;
            if (attemptId) {
                const { data, error: attemptError } = await supabase
                    .from('quiz_attempts')
                    .select('id, quiz_id, group_id, student_id, status, score, max_score, submitted_at')
                    .eq('id', attemptId)
                    .maybeSingle();

                // Only trust this attempt row if it's actually this student's.
                // A bad or someone-else's attempt id is treated the same as
                // "no attempt" rather than an error, so the quiz param (when
                // present) can still carry us forward to the normal
                // not-attempted-yet messaging instead of a dead end.
                if (!attemptError && data && data.student_id === user.id) {
                    attempt = data;
                }
            }

            const resolvedQuizId = attempt?.quiz_id || quizIdParam;
            if (!resolvedQuizId) {
                return showError("Can't open this review", "We couldn't find that quiz attempt, or it doesn't belong to your account.");
            }

            const { data: quiz, error: quizError } = await supabase
                .from('quizzes')
                .select('id, title, allow_review')
                .eq('id', resolvedQuizId)
                .maybeSingle();

            if (quizError || !quiz) {
                return showError("Can't open this review", "This quiz no longer exists.", { quizId: resolvedQuizId, attemptId: attempt?.id || null });
            }

            // Review is entirely the lecturer's call, and only unlocks once
            // grading is actually finished — never for a merely-submitted
            // attempt, and never before the student has attempted at all.
            if (!quiz.allow_review) {
                return showError('Review not enabled', "Your lecturer hasn't turned on answer review for this quiz.", { quizId: resolvedQuizId, attemptId: attempt?.id || null });
            }
            if (!attempt) {
                return showError('Attempt the quiz first', "You haven't attempted this quiz yet. Finish it, and once it's graded you'll be able to review your answers here.", { quizId: resolvedQuizId, attemptId: null });
            }
            if (attempt.status !== 'graded') {
                return showError('Not graded yet', "Your lecturer hasn't finished grading this attempt yet. Check back once grading is complete.", { quizId: resolvedQuizId, attemptId: attempt.id });
            }

            // Defense in depth against a ghost attempt: an attempt can be
            // marked "graded" with a score but have zero quiz_answers rows
            // behind it (quiz-session.js used to be able to produce exactly
            // this if the answers write silently failed — fixed there now,
            // but a row like that can still exist from before the fix). A
            // "graded" attempt with nothing actually answered isn't a real
            // review to show — it reads as if the student skipped every
            // question. Treat it the same as never having attempted.
            const { count: answerCount } = await supabase
                .from('quiz_answers')
                .select('id', { count: 'exact', head: true })
                .eq('attempt_id', attempt.id);
            if (!answerCount) {
                return showError('Attempt the quiz first', "We couldn't find any recorded answers for this attempt. Please attempt this quiz again, and once it's graded you'll be able to review your answers here.", { quizId: resolvedQuizId, attemptId: null });
            }

            await renderReviewScreen(quiz, attempt);
        }

        init().catch((err) => {
            console.error('Failed to load quiz review:', err);
            showError('Something went wrong', "We couldn't load this review. Please try again.");
        });
    </script></body>
</html>
