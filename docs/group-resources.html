<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Resources - PeerLoom</title>
<link rel="stylesheet" href="group-resources.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="light">

    <nav class="ios-nav" id="navBar">
        <button class="back-button" id="backButton" aria-label="Back to Active Groups">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="nav-title" id="navTitle">Resources</div>
        <button class="back-button" id="homeButton" aria-label="Go to Dashboard" style="margin-left:auto;">
            <i class="fas fa-house"></i>
        </button>
    </nav>

    <main class="quiz-hub-container">

        <section class="hero-card animate-fade-in">
            <div class="hero-heading">📚 <span id="heroTitle">Group Resources</span></div>
            <div class="hero-meta" id="heroMeta"></div>
        </section>

        <section class="stats-grid animate-fade-in" id="statsGrid">
            <div class="stat-card available">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card upcoming">
                <div class="stat-value" id="statWeek">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-value" id="statBookmarked">0</div>
                <div class="stat-label">Bookmarked</div>
            </div>
            <div class="stat-card average">
                <div class="stat-value" id="statDownloadable">0</div>
                <div class="stat-label">Downloadable</div>
            </div>
        </section>

        <section class="search-filters-container animate-fade-in">
            <div class="ios-search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search resources...">
            </div>

            <div class="segmented-control" id="filterControl">
                <button class="segment-btn active" data-filter="all">All</button>
                <button class="segment-btn" data-filter="documents">Documents</button>
                <button class="segment-btn" data-filter="media">Media</button>
                <button class="segment-btn" data-filter="links">Links</button>
                <button class="segment-btn" data-filter="bookmarked">Bookmarked</button>
            </div>

            <div class="sort-row">
                <label for="sortSelect">Sort by</label>
                <select class="ios-select" id="sortSelect">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="alphabetical">Alphabetical</option>
                </select>
            </div>
        </section>

        <section id="resourceListSection">
            <div class="quiz-list" id="resourceList">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>

    </main>

    <div class="toast" id="toast"></div>

    <script type="module" src="group-resources.js"></script>
  <script src="js/site-footer.js"></script>
</body>
</html>
