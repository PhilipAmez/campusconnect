<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Access - PeerLoom</title>
<link rel="stylesheet" href="quiz-session.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    body { overflow-x: hidden; }
    .ios-nav {
        position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: var(--space-sm);
        padding: 14px var(--space-md); background: var(--liquid-glass);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        border-bottom: 1px solid var(--glass-border);
    }
    .back-button {
        width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
        background: rgba(138,43,226,0.08); color: var(--text-primary); display: flex; align-items: center; justify-content: center;
    }
    .nav-title { font-weight: 700; font-size: 16px; }
    .nav-logo { height: 22px; width: auto; flex-shrink: 0; }

    .mem-wrap { max-width: 560px; margin: 0 auto; padding: var(--space-lg) var(--space-md) 60px; }

    .free-card, .expired-card {
        border-radius: var(--radius-xl); padding: var(--space-xl); margin-bottom: var(--space-lg);
        position: relative; overflow: hidden; animation: pop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .free-card {
        background: linear-gradient(135deg, rgba(52,199,89,0.1), rgba(52,199,89,0.03));
        border: 1px solid rgba(52,199,89,0.25);
    }
    .expired-card {
        background: linear-gradient(135deg, rgba(255,149,0,0.1), rgba(255,149,0,0.03));
        border: 1px solid rgba(255,149,0,0.25);
    }
    .card-badge {
        display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; margin-bottom: 6px;
        text-transform: uppercase; letter-spacing: 0.01em;
    }
    .card-ends-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-tertiary); margin-top: 10px; }
    .free-card .card-badge { color: var(--success); }
    .expired-card .card-badge { color: var(--warning); }
    .card-sub { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 4px; }
    .card-date { font-weight: 700; font-size: 14px; margin-top: 4px; }

    .feature-list { list-style: none; margin: var(--space-lg) 0; }
    .feature-list li {
        display: flex; align-items: center; gap: 10px; padding: 10px 2px; font-size: 14px; color: var(--text-primary);
        border-bottom: 1px solid var(--glass-border);
    }
    .feature-list li:last-child { border-bottom: none; }
    .feature-list li i.fa-circle-check { color: var(--success); width: 18px; text-align: center; }
    .feature-list li i.fa-lock { color: var(--text-tertiary); width: 18px; text-align: center; }
    .feature-list li.locked { color: var(--text-tertiary); }

    .plan-toggle {
        display: flex; background: var(--liquid-glass); border: 1px solid var(--glass-border); border-radius: var(--radius-full);
        padding: 4px; margin-bottom: var(--space-lg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .plan-toggle button {
        flex: 1; border: none; background: transparent; padding: 10px; border-radius: var(--radius-full);
        font-weight: 700; font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast);
    }
    .plan-toggle button.active { background: linear-gradient(135deg, var(--purple-border), var(--accent)); color: #fff; box-shadow: 0 4px 14px var(--purple-glow); }

    .price-card {
        background: var(--liquid-glass); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: var(--space-xl);
        text-align: center; margin-bottom: var(--space-lg);
    }
    .price-amount { font-size: 36px; font-weight: 800; }
    .price-amount span { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
    .price-save {
        display: inline-flex; margin-top: 8px; padding: 4px 12px; border-radius: var(--radius-full);
        background: rgba(52,199,89,0.12); color: var(--success); font-weight: 700; font-size: 12px;
    }
    .price-save.hidden { display: none; }

    .plan-cta {
        width: 100%; padding: 15px; border: none; border-radius: var(--radius-full); cursor: pointer;
        background: linear-gradient(135deg, var(--purple-border), var(--accent)); color: #fff; font-weight: 700; font-size: 15px;
    }
    .plan-cta:disabled { opacity: 0.55; cursor: not-allowed; }
    .continue-note { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-top: 10px; line-height: 1.5; }

    /* Must show the PeerLoom mark when real checkout goes live — never a
       generic row of third-party card-network/payment-provider logos. */
    .payment-brand-row {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--text-tertiary);
    }
    .payment-brand-logo { width: 20px; height: 20px; object-fit: contain; border-radius: 6px; }

    .not-lecturer-card {
        text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-secondary);
    }
    .not-lecturer-card i { font-size: 32px; color: var(--purple-border); margin-bottom: var(--space-md); }
    .skel { background: var(--liquid-glass); border-radius: var(--radius-lg); height: 160px; animation: shimmerSweep 1.4s linear infinite; }
</style>
  <script src="js/a11y.js" defer></script>
  <script type="module" src="js/global-notifications.js"></script>
  <script type="module" src="js/moderation-banner.js"></script>
</head>
<body data-theme="light">

    <nav class="ios-nav">
        <button class="back-button" id="backButton" aria-label="Go back"><i class="fas fa-arrow-left"></i></button>
        <img src="logo.png" alt="" class="nav-logo">
        <div class="nav-title">Lecturer Access</div>
    </nav>

    <main class="mem-wrap">
        <div id="content"><div class="skel"></div></div>
    </main>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';
        import { getCurrentUserContext } from './js/campusDiscovery.js';
        import { initGlobalTheme } from './js/themeManager.js';
        import { getMembershipSummary, PRICING, formatGHS } from './js/membership.js';

        document.getElementById('backButton').addEventListener('click', () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'lecturer-dashboard.html';
        });

        const FEATURES = [
            'Quiz Builder', 'Live Classes', 'Resources', 'Announcements',
            'Integrity Logs', 'Course Groups', 'Student Roster',
        ];

        function featureListHtml(unlocked) {
            return `<ul class="feature-list">${FEATURES.map(f => `
                <li class="${unlocked ? '' : 'locked'}">
                    <i class="fas ${unlocked ? 'fa-circle-check' : 'fa-lock'}"></i> ${f}
                </li>`).join('')}</ul>`;
        }

        function renderFreeYear(endsAt) {
            const endText = new Date(endsAt).toLocaleDateString('en', { month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('content').innerHTML = `
                <div class="free-card">
                    <div class="card-badge">🎓 Verified Lecturer Access</div>
                    <div class="card-sub">Your complimentary PeerLoom Lecturer Access is active.</div>
                    <div class="card-ends-label">Access ends:</div>
                    <div class="card-date">${endText}</div>
                </div>
                ${featureListHtml(true)}
                <p class="continue-note">No payment is requested during your free year. We'll notify you here before it ends.</p>
            `;
        }

        let selectedLecturerPlan = 'monthly';

        function renderLecturerPrice() {
            const amountEl = document.getElementById('lecPriceAmount');
            const saveEl = document.getElementById('lecPriceSave');
            if (!amountEl) return;
            document.querySelectorAll('#lecPlanToggle button').forEach(b => {
                const active = b.dataset.plan === selectedLecturerPlan;
                b.classList.toggle('active', active);
                b.setAttribute('aria-selected', String(active));
            });
            if (selectedLecturerPlan === 'monthly') {
                amountEl.innerHTML = `${formatGHS(PRICING.lecturer.monthly_price)}<span>/month</span>`;
                saveEl.classList.add('hidden');
            } else {
                amountEl.innerHTML = `${formatGHS(PRICING.lecturer.annual_price)}<span>/year</span>`;
                saveEl.classList.remove('hidden');
                saveEl.textContent = `Save ${Math.round(PRICING.lecturer.annual_discount * 100)}%`;
            }
        }

        function renderExpired() {
            // Confirmed: once a lecturer's free year ends, LECTURER_PAID is
            // billed at the exact same rate as a student plan — PRICING.lecturer
            // (see js/membership.js) is the single place that rate is defined.
            document.getElementById('content').innerHTML = `
                <div class="expired-card">
                    <div class="card-badge"><i class="fas fa-triangle-exclamation"></i> Access Ended</div>
                    <div class="card-sub">Your complimentary lecturer access has ended.</div>
                    <div class="card-sub">Choose a lecturer membership plan to continue using full teaching tools.</div>
                </div>
                ${featureListHtml(false)}
                <div class="plan-toggle" id="lecPlanToggle" role="tablist">
                    <button type="button" class="active" data-plan="monthly" role="tab" aria-selected="true">Monthly</button>
                    <button type="button" data-plan="yearly" role="tab" aria-selected="false">Yearly</button>
                </div>
                <div class="price-card">
                    <div class="price-amount" id="lecPriceAmount"></div>
                    <div class="price-save hidden" id="lecPriceSave">Save 3%</div>
                </div>
                <button type="button" class="plan-cta" id="lecContinueBtn">Continue to Payment</button>
                <div class="payment-brand-row">
                    <img src="logo.png" alt="PeerLoom" class="payment-brand-logo">
                    <span>Payments secured by PeerLoom</span>
                </div>
                <p class="continue-note" id="lecContinueNote">You'll be taken to Paystack's secure page to pay with mobile money or card. PeerLoom never sees your card or wallet details.</p>
            `;
            document.getElementById('lecPlanToggle').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-plan]');
                if (!btn) return;
                selectedLecturerPlan = btn.dataset.plan;
                renderLecturerPrice();
            });
            renderLecturerPrice();
            document.getElementById('lecContinueBtn').addEventListener('click', startCheckout);
        }

        async function accessToken() {
            const { data } = await supabase.auth.getSession();
            return data && data.session ? data.session.access_token : null;
        }
        // The server decides the price; membership switches on only after Paystack confirms.
        async function startCheckout() {
            const btn = document.getElementById('lecContinueBtn'), note = document.getElementById('lecContinueNote');
            const label = btn.textContent; btn.disabled = true; btn.textContent = 'Opening secure checkout…';
            try {
                const token = await accessToken();
                if (!token) { window.location.href = 'login.html'; return; }
                const r = await fetch('/api/paystack-initialize', { method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ interval: selectedLecturerPlan }) });
                const out = await r.json().catch(() => ({}));
                if (!r.ok || !out.url) throw new Error(out.error || 'Could not start payment.');
                const u = new URL(out.url);
                if (u.protocol !== 'https:' || u.hostname !== 'checkout.paystack.com') throw new Error('Unexpected checkout address.');
                window.location.href = out.url;
            } catch (e) { note.textContent = e.message || 'Could not start payment.'; btn.disabled = false; btn.textContent = label; }
        }

        async function confirmReturn() {
            const p = new URLSearchParams(location.search);
            const ref = p.get('reference') || p.get('trxref');
            if (!ref) return;
            history.replaceState(null, '', location.pathname);
            const token = await accessToken(); if (!token) return;
            for (let i = 0; i < 4; i++) {
                try {
                    const r = await fetch('/api/paystack-verify', { method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                        body: JSON.stringify({ reference: ref }) });
                    const out = await r.json().catch(() => ({}));
                    if (out.state === 'activated' || out.state === 'already_done' || out.state === 'failed' || out.state === 'abandoned') return;
                } catch (e) { /* retry */ }
                await new Promise(res => setTimeout(res, 2500));
            }
        }

        function renderNotLecturer() {
            document.getElementById('content').innerHTML = `
                <div class="not-lecturer-card">
                    <i class="fas fa-chalkboard-user"></i>
                    <h2 style="font-size:17px; font-weight:800; margin-bottom:6px;">Lecturer access only</h2>
                    <p>This page is for verified PeerLoom lecturers. If you believe this is a mistake, contact a Command Centre admin to verify your account.</p>
                </div>
            `;
        }

        async function init() {
            await initGlobalTheme({ supabase });
            const { user } = await getCurrentUserContext(supabase, { force: true });
            if (!user) { window.location.href = 'login.html'; return; }

            await confirmReturn();
            const summary = await getMembershipSummary();
            if (!summary || !summary.is_verified_lecturer) {
                renderNotLecturer();
                return;
            }
            const endsAt = summary.lecturer_free_ends_at;
            if (endsAt && new Date(endsAt) > new Date()) {
                renderFreeYear(endsAt);
            } else if (summary.lecturer_entitled) {
                // Entitled via an active paid subscription (future state —
                // no paid price exists yet, but the summary/entitlement
                // function already supports it).
                document.getElementById('content').innerHTML = `
                    <div class="free-card">
                        <div class="card-badge"><i class="fas fa-circle-check"></i> Lecturer Access Active</div>
                        <div class="card-sub">Your paid lecturer membership is active.</div>
                    </div>
                    ${featureListHtml(true)}
                `;
            } else {
                renderExpired();
            }
        }

        init().catch(err => console.error('lecturer-membership.html init failed:', err));
    </script>
</body>
</html>
