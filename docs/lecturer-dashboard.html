<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecturer Dashboard - Peerloom</title>
  <link rel="icon" href="/android-chrome-192x192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="/android-chrome-512x512.png" sizes="512x512" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="./lecturer-dashboard.css" />
</head>
<body>
  <div class="lecturer-shell" id="lecturerShell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main-panel">
      <div class="mobile-toolbar" id="mobileToolbar">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="mobile-toolbar-title">Lecturer Studio</span>
      </div>
      <header class="topbar" id="topbar"></header>
      <section class="content-area" id="contentArea"></section>
    </main>
  </div>

  <script type="module" src="./lecturer-dashboard.js"></script>
</body>
</html>
